<header class="navbar">
  <div class="navbar__inner">
    <button
      type="button"
      class="navbar__menu-btn"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="16" />
    </button>

    <a routerLink="/" class="navbar__brand" (click)="closeMenu()">Book Worm</a>

    <span class="navbar__divider" aria-hidden="true"></span>

    <nav class="navbar__links" [class.is-open]="menuOpen()" aria-label="Primary">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="is-active" (click)="closeMenu()">{{ link.label }}</a>
      }
    </nav>

    <div class="navbar__actions">
      <a routerLink="/cart" class="navbar__icon-btn" aria-label="Shopping cart" (click)="closeMenu()">
        <app-icon name="cart" [size]="18" />
        @if (cart.count() > 0) {
          <span class="navbar__badge">{{ cart.count() }}</span>
        }
      </a>
      <a routerLink="/orders" class="navbar__icon-btn" aria-label="Account" (click)="closeMenu()">
        <app-icon name="user" [size]="18" />
      </a>
    </div>
  </div>
</header>
