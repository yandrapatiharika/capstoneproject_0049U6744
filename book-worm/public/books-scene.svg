    <path d="M110 40l280-70v28l-280 70z" fill="#e8d6b0"/>
  </g>
  <!-- open book (bottom right) -->
  <g transform="translate(760 560)">
    <path d="M0 240L120 40l200 30 160 40-80 130z" fill="#d9c9a5"/>
    <path d="M120 40l200 30 160 40" fill="none" stroke="#bfa974" stroke-width="3"/>
    <path d="M0 240l60-90 180 20 240-60" fill="none" stroke="#bfa974" stroke-width="3"/>
    <path d="M-20 250L100 50l-20 -20-120 220z" fill="#b8472a"/>
