  <path d="M220 560c30-60 80-60 110-10s80 40 110-20" fill="none" stroke="#e7a43a" stroke-width="5" stroke-linecap="round"/>
  <path d="M1000 330c60-50 100-30 120 30s70 120 140 80" fill="none" stroke="#e7a43a" stroke-width="5" stroke-linecap="round"/>
  <path d="M70 620c40-30 80-20 110 0" fill="none" stroke="#7fb2d8" stroke-width="4" stroke-linecap="round"/>
  <!-- confetti diamonds -->
  <rect x="740" y="130" width="34" height="34" fill="#d9a441" transform="rotate(45 757 147)"/>
  <rect x="100" y="400" width="26" height="26" fill="#d9692f" transform="rotate(10 113 413)"/>
  <rect x="1240" y="250" width="26" height="26" fill="#d9692f" transform="rotate(20 1253 263)"/>
  <rect x="1300" y="450" width="24" height="24" fill="#d9a441" transform="rotate(30 1312 462)"/>
  <rect x="690" y="680" width="26" height="14" fill="#d9692f"/>
  <rect x="920" y="700" width="28" height="28" fill="#d9692f" transform="rotate(45 934 714)"/>
  <!-- big orange book (top left) -->
  <g transform="translate(120 130) rotate(-18)">
    <rect x="0" y="0" width="380" height="270" fill="#c4592a"/>
    <rect x="40" y="40" width="130" height="85" fill="#9c3d22"/>
    <path d="M0 270h380l-30 40H-20z" fill="#e8d6b0"/>
    <path d="M-20 310h370" stroke="#b69a67" stroke-width="3"/>
  </g>
  <!-- blue book (top center-right) -->
  <g transform="translate(900 0)">
    <rect x="0" y="0" width="140" height="220" fill="#2e6c9a"/>
    <rect x="-18" y="0" width="22" height="220" fill="#245a82"/>
    <path d="M0 220h140l-10 12H0z" fill="#e8d6b0"/>
  </g>
  <!-- stacked books (bottom left) -->
  <g transform="translate(250 560)">
    <path d="M0 40l260-70 40 100-260 70z" fill="#d6a53b"/>
    <path d="M40 140l260-70v38l-260 70z" fill="#e8d6b0"/>
